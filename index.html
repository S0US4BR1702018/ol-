<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Foto</title>
    <style>
        body {
            text-align: center;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
            -webkit-background-clip: text;
            color: transparent;
            animation: piscar 1s infinite;
            margin-top: 60px;
        }

        @keyframes piscar {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }

        img {
            margin-top: 30px;
            width: 500px;
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .touch-hint {
            margin-top: 40px;
            font-size: 20px;
            color: yellow;
            animation: piscar2 1s infinite;
        }

        @keyframes piscar2 {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>VAI TRABALHAR VAGABUNDO</h1>
    <img src="sua-foto.jpg" alt="Minha Foto">
    <div class="touch-hint">😎</div>

    <audio id="som" loop>
        <source src="som.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        const som = document.getElementById('som');

        function tocarSom() {
            som.play().then(() => {
                console.log("🎵 Som iniciado após toque na tela!");
            }).catch(err => {
                console.error("Não foi possível tocar o som:", err);
            });
            // Remove o listener depois que o som começar
            window.removeEventListener('touchstart', tocarSom);
        }

        // Escuta qualquer toque na tela
        window.addEventListener('touchstart', tocarSom);
        // Também funciona se o usuário clicar no desktop
        window.addEventListener('click', tocarSom);
    </script>
</body>
</html>
