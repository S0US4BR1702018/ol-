<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Foto</title>
    <style>
        body {
            text-align: center;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
            -webkit-background-clip: text;
            color: transparent;
            animation: piscar 1s infinite;
            margin-top: 60px;
        }

        @keyframes piscar {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }

        img {
            margin-top: 30px;
            width: 500px;
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <h1>VAI TRABALHAR VAGABUNDO</h1>
    <img src="sua-foto.jpg" alt="Minha Foto">

    <!-- Som principal -->
    <audio id="som" preload="auto">
        <source src="som.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        // Função que cria e toca um som silencioso
        function tocarSilencio() {
            const contexto = new (window.AudioContext || window.webkitAudioContext)();
            const buffer = contexto.createBuffer(1, 1, 22050);
            const fonte = contexto.createBufferSource();
            fonte.buffer = buffer;
            fonte.connect(contexto.destination);
            fonte.start(0);
        }

        // Ao carregar a página, toca o som silencioso e depois o real
        window.addEventListener('load', function() {
            try {
                tocarSilencio();
                const som = document.getElementById('som');
                som.play().catch(() => {
                    console.log("Autoplay bloqueado — o usuário precisa clicar em algum lugar primeiro.");
                });
            } catch (e) {
                console.error("Erro ao tentar reproduzir o som:", e);
            }
        });
    </script>
</body>
</html>
